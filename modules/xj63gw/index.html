  .modulex-referans-ilce-suzgec-cip:hover { border-color: --accent--; }

  .modulex-referans-ilce-suzgec-is--gel { animation: modulex-referans-ilce-suzgec-belir 0.4s ease both; }
  .modulex-referans-ilce-suzgec-fis { position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; height: 100%; padding: 20px 22px 22px; border-inline-start: 5px solid --accent--; border-radius: --yuvarlak--; background: --kartBg--; box-shadow: 0 10px 24px -22px color-mix(in srgb, --text-- 60%, transparent); transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .modulex-referans-ilce-suzgec-fis:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -24px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-referans-ilce-suzgec-fust { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .modulex-referans-ilce-suzgec-fno { color: --muted--; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78rem; font-weight: 700; }
  .modulex-referans-ilce-suzgec-konum { display: inline-flex; align-items: center; gap: 4px; padding-block: 3px; padding-inline: 6px 10px; border-radius: 999px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --text--; font-size: 0.82rem; font-weight: 700; }
  .modulex-referans-ilce-suzgec-konum .material-symbols-outlined { font-size: 16px; color: --accentInk--; }

  .modulex-referans-ilce-suzgec-fbag::after { content: ""; position: absolute; inset: 0; }
  .modulex-referans-ilce-suzgec-fbag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-referans-ilce-suzgec-falt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block-start: 12px; border-block-start: 1px dashed --cizgi--; }
  .modulex-referans-ilce-suzgec-tur { display: inline-flex; align-items: center; gap: 4px; color: --accentInk--; font-size: 0.82rem; font-weight: 700; }
  .modulex-referans-ilce-suzgec-tur .material-symbols-outlined { font-size: 18px; }

  .modulex-referans-ilce-suzgec-fis:hover .modulex-referans-ilce-suzgec-flogo { filter: none; }

  @media (max-width: 768px) {

    .modulex-referans-ilce-suzgec-suzgec { flex-wrap: nowrap; overflow-x: auto; padding-block-end: 4px; scrollbar-width: none; }

  }
  .modulex-referans-ilce-suzgec-logo { display: block; width: auto; max-width: 100%; height: clamp(32px, 4vw, 48px); object-fit: contain; filter: grayscale(1); transition: filter 0.3s ease, transform 0.3s ease; }
  .modulex-referans-ilce-suzgec-kelime { display: inline-block; color: --text--; font-family: var(--mx-font-heading, inherit); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; transition: color 0.3s ease; }

  .modulex-referans-ilce-suzgec-yil { color: --muted--; font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-ilce-suzgec :is(.modulex-referans-ilce-suzgec-baslik, .modulex-referans-ilce-suzgec-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-referans-ilce-suzgec-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-referans-ilce-suzgec { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-referans-ilce-suzgec *, .modulex-referans-ilce-suzgec *::before, .modulex-referans-ilce-suzgec *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-referans-ilce-suzgec";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const ilceSuz = (s, P, az) => {
        const cip = [...s.querySelectorAll("[data-ilce-sec]")];
        const isler = [...s.querySelectorAll("[data-ilce]")];
        if (!cip.length) return;
        s.classList.add(P + "--ijs");
        const sonuc = s.querySelector("[data-ilce-kalip]");
        let nf = null;
        try { nf = new Intl.NumberFormat(document.documentElement.lang || undefined); } catch (x) { nf = null; }
        const secili = new Set();
        const uygula = () => {
          let n = 0;
          isler.forEach((li) => {
            const gor = !secili.size || secili.has(li.dataset.ilce);
            li.hidden = !gor;
            if (!gor) return;
            n++;
            if (!az) { li.classList.remove(P + "-is--gel"); void li.offsetWidth; li.classList.add(P + "-is--gel"); }
          });
          cip.forEach((c) => c.setAttribute("aria-pressed", String(c.dataset.ilceSec === "" ? !secili.size : secili.has(c.dataset.ilceSec))));
          if (sonuc) sonuc.textContent = sonuc.dataset.ilceKalip.split("{n}").join(nf ? nf.format(n) : String(n));
        };
        cip.forEach((c) => c.addEventListener("click", () => {
          const v = c.dataset.ilceSec;
          if (!v) secili.clear();
          else if (secili.has(v)) secili.delete(v);
          else secili.add(v);
          uygula();
        }));
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      ilceSuz(s, P, az);
    });
  })();
</script>
