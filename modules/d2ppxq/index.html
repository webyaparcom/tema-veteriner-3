  .modulex-ekip-calisma-gunu-cip[aria-pressed="true"] .modulex-ekip-calisma-gunu-cad { background: --accent--; color: --accentText--; }
  .modulex-ekip-calisma-gunu-cip--bugun::after { content: ""; position: absolute; inset-block-end: 5px; inset-inline-end: 6px; width: 7px; height: 7px; border-radius: 50%; background: --accent--; }
  .modulex-ekip-calisma-gunu-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 16px; }
  .modulex-ekip-calisma-gunu-hekim { display: grid; grid-template-columns: auto minmax(0, 1fr); align-content: start; gap: 14px 16px; padding: 18px; border-radius: --yuvarlak--; background: --bg--; transition: box-shadow 0.3s ease; }
  .modulex-ekip-calisma-gunu-hekim:hover { box-shadow: 0 18px 34px -26px color-mix(in srgb, --text-- 60%, transparent); }
  .modulex-ekip-calisma-gunu--gel { animation: modulex-ekip-calisma-gunu-gel 0.4s ease both; animation-delay: calc(var(--s, 0) * 45ms); }
  @keyframes modulex-ekip-calisma-gunu-gel { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }
  .modulex-ekip-calisma-gunu-foto { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; font-size: 1.3rem; }
  .modulex-ekip-calisma-gunu-yazi { display: grid; align-content: center; gap: 2px; }
  .modulex-ekip-calisma-gunu-hafta, .modulex-ekip-calisma-gunu-saat { grid-column: 1 / -1; }
  .modulex-ekip-calisma-gunu-serit { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .modulex-ekip-calisma-gunu-g { display: grid; place-items: center; height: 30px; border-radius: 8px; background: color-mix(in srgb, --text-- 6%, transparent); color: --muted--; font-size: 0.78rem; font-weight: 700; transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease; }
  .modulex-ekip-calisma-gunu-g--var { background: color-mix(in srgb, --accent-- 22%, --bg--); color: --accentInk--; }
  .modulex-ekip-calisma-gunu-g--var.modulex-ekip-calisma-gunu-g--secili { background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-ekip-calisma-gunu-gizli { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .modulex-ekip-calisma-gunu-saat { display: inline-flex; align-items: center; gap: 6px; color: --muted--; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .modulex-ekip-calisma-gunu-saat .material-symbols-outlined { font-size: 18px; color: --accentInk--; }
  @media (max-width: 768px) {
    .modulex-ekip-calisma-gunu-takvim { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; padding-block-end: 4px; }

    .modulex-ekip-calisma-gunu-liste { grid-template-columns: minmax(0, 1fr); }
  }
  /* img width/height öznitelikleri CSS yüksekliği olur — aspect-ratio'nun çalışması için yükseklik auto (modül kuralı ezebilir) */
  :where(.modulex-ekip-calisma-gunu) img { height: auto; }
  .modulex-ekip-calisma-gunu-foto { min-width: 0; }
  .modulex-ekip-calisma-gunu-bag { color: inherit; text-decoration: none; }
  .modulex-ekip-calisma-gunu-bag:hover { text-decoration: underline; text-underline-offset: 4px; }
  .modulex-ekip-calisma-gunu-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }
  .modulex-ekip-calisma-gunu-sosyal { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-ekip-calisma-gunu-slink { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 40px; min-height: 40px; padding: 0 10px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-size: 0.88rem; text-decoration: none; transition: background-color 0.25s ease, color 0.25s ease, border-color 0.25s ease; }
  .modulex-ekip-calisma-gunu-slink:hover { background-color: --accent--; border-color: --accent--; color: --accentText--; }
  .modulex-ekip-calisma-gunu-slink .material-symbols-outlined { font-size: 19px; }
  .modulex-ekip-calisma-gunu-syazi { overflow-wrap: anywhere; }
  .modulex-ekip-calisma-gunu-ad { font-size: 1.12rem; font-weight: 750; line-height: 1.3; }
  .modulex-ekip-calisma-gunu-unvan { color: --accentInk--; font-size: 0.92rem; font-weight: 650; }
  .modulex-ekip-calisma-gunu-bio { color: --muted--; font-size: 0.95rem; line-height: 1.65; }
  .modulex-ekip-calisma-gunu-bolum { color: --muted--; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-calisma-gunu :is(.modulex-ekip-calisma-gunu-baslik, .modulex-ekip-calisma-gunu-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-calisma-gunu-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-calisma-gunu { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-calisma-gunu *, .modulex-ekip-calisma-gunu *::before, .modulex-ekip-calisma-gunu *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-calisma-gunu";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gunSec = (s, P, az) => {
        const c = [...s.querySelectorAll("[data-gun]")];
        const k = [...s.querySelectorAll("[data-gunler]")];
        if (c.length < 2) return;
        s.classList.add(P + "--js");
        const sec = (v, oynat) => {
          c.forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.gun === v)));
          let n = 0;
          k.forEach((x) => {
            const gor = !v || x.dataset.gunler.split(" ").includes(v);
            x.hidden = !gor;
            x.classList.remove(P + "--gel");
            if (gor) { n++; x.style.setProperty("--s", String(n)); if (oynat && !az) { void x.offsetWidth; x.classList.add(P + "--gel"); } }
          });
          s.querySelectorAll("[data-g]").forEach((g) => g.classList.toggle(P + "-g--secili", g.dataset.g === v));
        };
        const bugun = String(((new Date().getDay() + 6) % 7) + 1);
        c.forEach((x) => {
          if (x.dataset.gun === bugun) x.classList.add(P + "-cip--bugun");
          x.addEventListener("click", () => sec(x.dataset.gun, true));
        });
        sec("");
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gunSec(s, P, az);
    });
  })();
</script>
