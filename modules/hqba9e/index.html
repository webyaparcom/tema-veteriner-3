<script>
  (() => {
    const P = "modulex-acilis-sube-yakin";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const subeYakin = (s, P) => {
        const ol = s.querySelector("[data-subeler]");
        if (!ol) return;
        const li = Array.from(ol.children);
        if (!li.length) return;
        s.classList.add(P + "--hjs");
        const etiket = s.querySelector("[data-yakin]");
        const dugme = s.querySelector("[data-konum]");
        let sirali = null;
        let aktif = li.find((y) => y.classList.contains(P + "-sube--one")) || li[0];
        const diz = () => {
          ol.append(...[aktif].concat((sirali || li).filter((y) => y !== aktif)));
          li.forEach((y) => {
            const on = y === aktif;
            y.classList.toggle(P + "-sube--one", on);
            const b = y.querySelector("[data-sec]");
            if (b) b.hidden = on;
          });
          if (etiket) etiket.hidden = !(sirali && aktif === sirali[0]);
        };
        li.forEach((y) => {
          const b = y.querySelector("[data-sec]");
          if (!b) return;
          b.addEventListener("click", () => {
            aktif = y;
            diz();
            y.classList.remove(P + "--yeni");
            void y.offsetWidth;
            y.classList.add(P + "--yeni");
            const a = y.querySelector("a");
            if (a) a.focus();
          });
        });
        if (dugme && navigator.geolocation) {
          let f;
          try { f = new Intl.NumberFormat(document.documentElement.lang || undefined, { style: "unit", unit: "kilometer", maximumFractionDigits: 1 }); } catch (x) { f = { format: (n) => n.toFixed(1) + " km" }; }
          const rad = (d) => (d * Math.PI) / 180;
          const mesafe = (a1, b1, a2, b2) => {
            const h = Math.sin(rad(a2 - a1) / 2) ** 2 + Math.cos(rad(a1)) * Math.cos(rad(a2)) * Math.sin(rad(b2 - b1) / 2) ** 2;
            return 12742 * Math.asin(Math.min(1, Math.sqrt(h)));
          };
          const bitir = () => { dugme.disabled = false; dugme.removeAttribute("aria-busy"); };
          dugme.hidden = false;
          dugme.addEventListener("click", () => {
            dugme.disabled = true;
            dugme.setAttribute("aria-busy", "true");
            navigator.geolocation.getCurrentPosition((p) => {
              const e = p.coords.latitude;
              const b = p.coords.longitude;
              const km = new Map();
              li.forEach((y) => {
                const ye = parseFloat(y.dataset.enlem);
                const yb = parseFloat(y.dataset.boylam);
                const m = y.querySelector("[data-mesafe]");
                if (!Number.isFinite(ye) || !Number.isFinite(yb)) { km.set(y, Infinity); return; }
                const d = mesafe(e, b, ye, yb);
                km.set(y, d);
                if (m) { m.textContent = f.format(d); m.hidden = false; }
              });
              sirali = li.slice().sort((x, y) => km.get(x) - km.get(y));
              aktif = sirali[0];
              diz();
              bitir();
              dugme.setAttribute("aria-pressed", "true");
            }, () => {
              bitir();
              dugme.classList.add(P + "-konum--hata");
              const i = dugme.querySelector(".material-symbols-outlined");
              if (i) i.textContent = "location_disabled";
            }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
          });
        }
        diz();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      subeYakin(s, P, az);
    });
  })();
</script>
